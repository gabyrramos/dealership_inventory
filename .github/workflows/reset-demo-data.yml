name: Reset demo data

# Manual. Wipes every table and loads the seed again. Run once after the first deploy,
# and whenever you want the demo data back to how it started.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RESET to confirm. This deletes all data."
        required: true

permissions:
  contents: read

jobs:
  reset:
    if: inputs.confirm == 'RESET'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Apply migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Seed (reset)
        run: npx wrangler d1 execute DB --remote --file=db/seed/seed.sql
